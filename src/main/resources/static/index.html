<!doctype html>
<html lang="en">
<head>
	<meta charset="utf-8">
	<meta name="viewport" content="width=device-width, initial-scale=1">
	<title>SideQuest/s</title>
	<meta name="description" content="SideQuest/s - the CIT-U guild quest board">
	<link rel="preconnect" href="https://fonts.googleapis.com">
	<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
	<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Montserrat:wght@800;900&display=swap" rel="stylesheet">
	<link rel="stylesheet" href="css/styles.css">
</head>
<body>
	<nav class="sidebar" id="sidebar" aria-label="Main"></nav>

	<div class="main">
		<header class="header">
			<div class="header-row">
				<h1 class="brand">SIDEQUEST</h1>
				<div class="header-icons" id="header-icons"></div>
			</div>
			<form class="search" id="search-form" role="search">
				<svg class="icon" viewBox="0 0 24 24" aria-hidden="true"><circle cx="11" cy="11" r="7"/><path d="m20 20-3.5-3.5"/></svg>
				<input id="search-input" type="search" placeholder="...what are we looking for?" aria-label="Search quests" autocomplete="off">
			</form>
		</header>

		<main class="content">
			<h2 class="title-xl">NEAR YOU!!</h2>

			<div class="toolbar">
				<select class="select-pill" id="location" aria-label="Location preference">
					<option value="">Anywhere on campus</option>
				</select>
				<select class="select-pill" id="size" aria-label="Quest size">
					<option value="">Any size</option>
				</select>
				<span class="count" id="count"></span>
			</div>
			<div class="toolbar" id="chips" role="group" aria-label="Categories"></div>

			<div class="grid" id="grid" aria-live="polite"></div>
		</main>
	</div>

	<div class="toast" id="toast" role="status" aria-live="polite"></div>

	<script src="js/common.js"></script>
	<script src="js/board.js"></script>
</body>
</html>
