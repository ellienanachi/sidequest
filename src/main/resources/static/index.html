<!doctype html>
<html lang="en">
<head>
	<meta charset="utf-8">
	<meta name="viewport" content="width=device-width, initial-scale=1">
	<title>SideQuest/s</title>
	<meta name="description" content="SideQuest/s - the CIT-U student gig marketplace">
	<link rel="preconnect" href="https://fonts.googleapis.com">
	<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
	<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
	<link rel="stylesheet" href="css/styles.css">
</head>
<body>

	<!-- Top bar -->
	<header class="topbar">
		<div class="topbar-inner">
			<a class="logo" href="/">SideQuest<span class="logo-slash">/s</span></a>

			<nav class="topnav" aria-label="Main">
				<a class="topnav-link is-active" href="/">Browse</a>
				<a class="topnav-link" href="#" data-soon="Posting a quest">Post a quest</a>
				<a class="topnav-link" href="#" data-soon="Messages">Messages</a>
			</nav>

			<div class="topbar-actions">
				<button class="icon-btn" type="button" aria-label="Notifications" data-soon="Notifications">
					<svg viewBox="0 0 24 24" aria-hidden="true"><path d="M6 8a6 6 0 0 1 12 0c0 7 3 9 3 9H3s3-2 3-9"/><path d="M10.3 21a1.94 1.94 0 0 0 3.4 0"/></svg>
					<span class="dot"></span>
				</button>
				<button class="avatar" type="button" aria-label="Your profile" data-soon="Profiles">JD</button>
			</div>
		</div>
	</header>

	<main>
		<!-- Hero + search -->
		<section class="hero">
			<div class="hero-inner">
				<p class="eyebrow">CIT-U student marketplace</p>
				<h1>Find a side quest<br>on campus.</h1>
				<p class="hero-sub">Book help from fellow Technologians, or earn by offering your own skills.</p>

				<form class="search" id="search-form" role="search">
					<svg class="search-icon" viewBox="0 0 24 24" aria-hidden="true"><circle cx="11" cy="11" r="7"/><path d="m20 20-3.5-3.5"/></svg>
					<input id="search-input" type="search" placeholder="Try &ldquo;tutoring&rdquo; or &ldquo;logo&rdquo;" aria-label="Search quests" autocomplete="off">
					<button type="submit">Search</button>
				</form>
			</div>
		</section>

		<!-- Categories -->
		<section class="content">
			<div class="chips" id="chips" role="tablist" aria-label="Categories"></div>

			<div class="section-head">
				<h2>Open quests</h2>
				<span class="count" id="count"></span>
			</div>

			<div class="grid" id="grid" aria-live="polite"></div>
		</section>
	</main>

	<footer class="footer">
		Preview build &middot; sample data only &middot; booking, login and posting are not built yet
	</footer>

	<!-- Bottom tab bar (phones) -->
	<nav class="tabbar" aria-label="App">
		<a class="tab is-active" href="/">
			<svg viewBox="0 0 24 24" aria-hidden="true"><path d="M3 10.5 12 3l9 7.5V20a1 1 0 0 1-1 1h-5v-6h-6v6H4a1 1 0 0 1-1-1z"/></svg>
			<span>Home</span>
		</a>
		<a class="tab" href="#" data-focus-search>
			<svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="11" cy="11" r="7"/><path d="m20 20-3.5-3.5"/></svg>
			<span>Search</span>
		</a>
		<a class="tab tab-post" href="#" data-soon="Posting a quest" aria-label="Post a quest">
			<svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 5v14M5 12h14"/></svg>
		</a>
		<a class="tab" href="#" data-soon="Messages">
			<svg viewBox="0 0 24 24" aria-hidden="true"><path d="M21 15a2 2 0 0 1-2 2H7l-4 4V5a2 2 0 0 1 2-2h14a2 2 0 0 1 2 2z"/></svg>
			<span>Messages</span>
		</a>
		<a class="tab" href="#" data-soon="Profiles">
			<svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="8" r="4"/><path d="M4 21a8 8 0 0 1 16 0"/></svg>
			<span>Profile</span>
		</a>
	</nav>

	<div class="toast" id="toast" role="status" aria-live="polite"></div>

	<script src="js/app.js"></script>
</body>
</html>
