<!doctype html>
<html lang="en">
<head>
	<meta charset="utf-8">
	<meta name="viewport" content="width=device-width, initial-scale=1">
	<title>Quest Details · SideQuest/s</title>
	<meta name="description" content="Quest details on SideQuest/s">
	<link rel="preconnect" href="https://fonts.googleapis.com">
	<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
	<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Montserrat:wght@800;900&display=swap" rel="stylesheet">
	<link rel="stylesheet" href="css/styles.css">
</head>
<body>
	<nav class="sidebar" id="sidebar" aria-label="Main"></nav>

	<div class="main">
		<header class="detail-hero">
			<a class="hero-btn back" href="/" aria-label="Back to the Quest Board" id="back"></a>
			<div class="hero-art" id="hero-art" aria-hidden="true"></div>
			<button class="hero-btn save" type="button" aria-label="Save quest" aria-pressed="false" id="save"></button>
		</header>

		<main class="detail-body" id="detail" aria-live="polite">
			<div class="skeleton"></div>
		</main>

		<div class="action-bar" id="action-bar" hidden>
			<button class="side-link" type="button" aria-label="Message the quest giver" id="message"></button>
			<button class="btn-forest" type="button" id="request">Request!</button>
			<span class="action-note" id="action-note"></span>
		</div>
	</div>

	<div class="toast" id="toast" role="status" aria-live="polite"></div>

	<script src="js/common.js"></script>
	<script src="js/quest.js"></script>
</body>
</html>
