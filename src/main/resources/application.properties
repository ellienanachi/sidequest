spring.application.name=sidequest-s

# --- Profiles ---
# dev  (default): H2 in-memory database + sample data, see application-dev.properties
# mysql: local MySQL + sample data, for viewing the ERD in MySQL Workbench, see application-mysql.properties
# prod: PostgreSQL on Render, see application-prod.properties
#       (set the environment variable SPRING_PROFILES_ACTIVE=prod on the server)
spring.profiles.active=dev

# --- JPA / Hibernate ---
spring.jpa.open-in-view=false
spring.jpa.hibernate.ddl-auto=update

# --- Payments ---
# "simulated" fakes GCash, Maya and QR Ph so the whole escrow flow can be tested with no real money.
# TODO: add a PayMongo (test mode) gateway and switch this to "paymongo".
sidequest.payments.gateway=simulated

# TODO: add Spring Security config here once auth is implemented.
