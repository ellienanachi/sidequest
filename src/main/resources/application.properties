spring.application.name=sidequest-s

# --- Profiles ---
# dev  (default): H2 in-memory database, see application-dev.properties
# mysql: local MySQL, for viewing the ERD in MySQL Workbench, see application-mysql.properties
# prod: PostgreSQL on Render, see application-prod.properties
#       (set the environment variable SPRING_PROFILES_ACTIVE=prod on the server)
spring.profiles.active=dev

# --- JPA / Hibernate ---
spring.jpa.open-in-view=false
spring.jpa.hibernate.ddl-auto=update


