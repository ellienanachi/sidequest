# --- Local MySQL (class activity: reverse engineer the ERD in MySQL Workbench) ---
# Run with:  $env:MYSQL_PASSWORD="your root password"; .\mvnw.cmd spring-boot:run "-Dspring-boot.run.profiles=mysql"
# Hibernate creates every table and foreign key (ddl-auto=update in application.properties),
# then Workbench: Database > Reverse Engineer > pick the schema > the EER diagram shows the ERD.
#
# The schema is created on the first run if it doesn't exist. Change it with MYSQL_DB (e.g. dbg7sanchez).
# Never commit the real password: it comes from the MYSQL_PASSWORD environment variable.
spring.datasource.url=jdbc:mysql://localhost:3306/${MYSQL_DB:sidequest}?createDatabaseIfNotExist=true
spring.datasource.username=${MYSQL_USER:root}
spring.datasource.password=${MYSQL_PASSWORD:}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

spring.jpa.show-sql=true
