# --- PostgreSQL on Render (workbook: Render PostgreSQL, 256 MB) ---
# All values come from environment variables set on the server. Never commit real passwords.
# DB_URL looks like: jdbc:postgresql://<host>:5432/sidequest
spring.datasource.url=${DB_URL}
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}
spring.datasource.driver-class-name=org.postgresql.Driver

# Render gives the port to use in the PORT variable.
server.port=${PORT:8080}
